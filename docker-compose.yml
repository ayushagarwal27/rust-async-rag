# Production deployment — joins the existing Traefik instance (from the
# n8n stack at /docker/n8n) for TLS termination on rustler.in.
#
# Deploy: docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: async-rust-rag
    restart: always
    env_file:
      - .env
    labels:
      - traefik.enable=true
      - "traefik.http.routers.rustrag.rule=Host(`rustler.in`)"
      - traefik.http.routers.rustrag.tls=true
      - traefik.http.routers.rustrag.entrypoints=web,websecure
      - traefik.http.routers.rustrag.tls.certresolver=mytlschallenge
      - traefik.http.services.rustrag.loadbalancer.server.port=8000
      - traefik.http.middlewares.rustrag.headers.SSLRedirect=true
      - traefik.http.middlewares.rustrag.headers.STSSeconds=315360000
      - traefik.http.middlewares.rustrag.headers.browserXSSFilter=true
      - traefik.http.middlewares.rustrag.headers.contentTypeNosniff=true
      - traefik.http.middlewares.rustrag.headers.forceSTSHeader=true
      - traefik.http.middlewares.rustrag.headers.SSLHost=rustler.in
      - traefik.http.middlewares.rustrag.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.rustrag.headers.STSPreload=true
      - traefik.http.routers.rustrag.middlewares=rustrag@docker
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
